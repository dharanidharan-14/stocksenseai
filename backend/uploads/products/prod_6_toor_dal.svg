<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_Farm Fresh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="280" height="280" rx="18" fill="url(#bg_Farm Fresh)" stroke="#ea580c" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Outer Badge / Header -->
  <g transform="translate(18, 16)">
    <rect width="90" height="22" rx="11" fill="#ea580c" opacity="0.12"/>
    <text x="45" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#c2410c">Unpolished Pulse</text>
  </g>

  <!-- Weight Tag -->
  <g transform="translate(185, 16)">
    <rect width="75" height="22" rx="11" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
    <text x="37" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#c2410c">1 kg</text>
  </g>

  <!-- Central Package Art -->
  <g transform="translate(60, 56)" filter="url(#shadow)">
    <!-- Package body -->
    <rect x="10" y="10" width="140" height="130" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
    <!-- Brand Banner Stripe -->
    <rect x="10" y="32" width="140" height="36" fill="#ea580c"/>
    <text x="80" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#ffffff" letter-spacing="0.5">Farm Fresh</text>
    <!-- Subtitle on pack -->
    <text x="80" y="92" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#c2410c">Toor Dal</text>
    <!-- Bottom seal -->
    <rect x="25" y="112" width="110" height="16" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <circle cx="80" cy="120" r="4" fill="#ea580c"/>
  </g>

  <!-- Bottom Brand Title -->
  <text x="140" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#1e293b">Farm Fresh</text>
  <text x="140" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">Toor Dal</text>
</svg>